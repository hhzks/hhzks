<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <!-- outer bezel: dark at the bottom so the edge reads as a lip -->
    <linearGradient id="bezel" x1="32" y1="1" x2="32" y2="63" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9b2cad"/>
      <stop offset="1" stop-color="#420b4b"/>
    </linearGradient>
    <!-- body -->
    <linearGradient id="body" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e162f5"/>
      <stop offset="0.45" stop-color="#bf37d4"/>
      <stop offset="1" stop-color="#8a1b9d"/>
    </linearGradient>
    <!-- raised face -->
    <linearGradient id="face" x1="32" y1="11" x2="32" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7e4fb"/>
      <stop offset="0.5" stop-color="#d283de"/>
      <stop offset="1" stop-color="#ac52bd"/>
    </linearGradient>
    <!-- the gloss sweep across the top half -->
    <linearGradient id="gloss" x1="32" y1="11" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <!-- rim: lit on top, warm bounce along the bottom -->
    <linearGradient id="rim" x1="32" y1="4" x2="32" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffb3f2" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="bounce" cx="32" cy="59" r="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9df0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff9df0" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="clipBody"><rect x="4" y="4" width="56" height="56" rx="13"/></clipPath>
    <clipPath id="clipFace"><rect x="11" y="11" width="42" height="42" rx="9"/></clipPath>
    <filter id="soften" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.7"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bezel)"/>
  <rect x="4" y="4" width="56" height="56" rx="13" fill="url(#body)"/>
  <g clip-path="url(#clipBody)">
    <rect x="4" y="30" width="56" height="30" fill="url(#bounce)"/>
  </g>
  <rect x="4.5" y="4.5" width="55" height="55" rx="12.5" fill="none" stroke="url(#rim)"/>

  <rect x="11" y="11" width="42" height="42" rx="9" fill="url(#face)"/>
  <g clip-path="url(#clipFace)">
    <path d="M8 11h48v18c-9 8-39 8-48-2z" fill="url(#gloss)"/>
    <ellipse cx="24" cy="18" rx="11" ry="4.5" fill="#ffffff" opacity="0.55" filter="url(#soften)"/>
    <rect x="11" y="11" width="42" height="42" rx="9" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
  </g>
</svg>