name: daily-lights-out

on:
  schedule:
    # Actions cron is queued at low priority and drifts by minutes to hours,
    # so nothing user-facing promises a specific time of day.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Puzzle date (YYYY-MM-DD). Blank means today, UTC."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-lights-out
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      # The daily commits are the repo owner's, not github-actions[bot]'s, so
      # they read as the owner's activity. The noreply address is the one
      # GitHub itself uses for web commits, so it attributes to the account
      # without publishing a real address.
      GIT_AUTHOR_NAME: hhzks
      GIT_AUTHOR_EMAIL: 125699372+hhzks@users.noreply.github.com
      GIT_COMMITTER_NAME: hhzks
      GIT_COMMITTER_EMAIL: 125699372+hhzks@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s src -t src

      - name: Generate the puzzle
        run: |
          python src/generate.py --out build/daily \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      # Must pass before anything is pushed: a broken push means a dead puzzle
      # on the profile until tomorrow.
      - name: Verify
        run: |
          python src/verify.py --out build/daily --days 14 \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Commit README and archive to main
        run: |
          # Staged explicitly -- never `git add -A`, which would sweep in build/.
          git add README.md archive
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "lights out: $(date -u +%F)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Force-push the state graph to the orphan daily branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A fresh repo each run, so `daily` never accumulates history.
          cd build/daily
          git init -q -b daily
          git add -A
          git commit -q -m "puzzle $(date -u +%F)"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" daily

      - name: Summary
        run: |
          {
            echo "### Lights Out"
            echo ""
            echo "- states published: $(find build/daily -name '*.md' | wc -l)"
            echo "- size: $(du -sh build/daily | cut -f1)"
            echo "- board: https://github.com/${GITHUB_REPOSITORY}"
          } >> "$GITHUB_STEP_SUMMARY"
